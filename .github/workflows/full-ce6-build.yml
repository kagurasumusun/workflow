name: full-ce6-build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'CE6 BSP/platform directory name'
        required: true
        type: string
      osdesign:
        description: 'Optional .pbxml path relative to ce600'
        required: false
        default: ''
        type: string
      cpu:
        description: 'CE6 target CPU'
        required: false
        default: ARMV4I
        type: string
      sysgen_defaults:
        description: 'Use catalog DefaultValue=1 SYSGEN variables when no OS Design is supplied'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  full-ce6:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build platform and CE source
        shell: bash
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "$WINCE_REPO_PAT"
          AUTH=$(printf '%s:%s' 'kagurasumusun' "$WINCE_REPO_PAT" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic ${AUTH}" \
            clone --depth 1 --branch main \
            https://github.com/kagurasumusun/wince-build.git wince-build
          git -c "http.extraheader=Authorization: Basic ${AUTH}" \
            clone --depth 1 --branch main \
            https://github.com/kagurasumusun/wince-source.git wince-source
          git -C wince-build remote set-url origin https://github.com/kagurasumusun/wince-build.git
          git -C wince-source remote set-url origin https://github.com/kagurasumusun/wince-source.git
          git -C wince-build rev-parse HEAD | tee revisions.txt
          git -C wince-source rev-parse HEAD | tee -a revisions.txt
          test -d wince-source/ce600/PUBLIC
          test -d wince-source/ce600/PRIVATE
          test -d wince-source/ce600/PLATFORM

      - name: Free disposable runner disk
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/local/share/powershell /opt/ghc \
            /usr/local/share/chromium /usr/local/lib/node_modules || true
          df -h /

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure and build wince-build
        working-directory: wince-build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4 --verbose 2>&1 | tee ../wcebuild-build.log
          ctest --test-dir build --output-on-failure --parallel 2 2>&1 | tee ../wcebuild-ctest.log

      - name: Verify current tool layout
        working-directory: wince-build
        shell: bash
        run: |
          set -euo pipefail
          test -x build/wcefullbuild
          test -x build/petool
          test -d include/wce/core
          test -d include/wce/model
          test -d include/wce/frontend
          test -d include/wce/build
          test -d include/wce/toolchain
          test -d include/wce/sysgen
          test -d include/wce/image
          test ! -d src/wce
          test ! -d scripts
          test ! -d config
          test ! -d external
          test ! -d engine
          test -d third_party/wince-source
          test -s docs/REPOSITORY-ARCHITECTURE.md

      - name: Run real CE6 build through the unified pipeline
        shell: bash
        env:
          CE_PLATFORM: ${{ inputs.platform }}
          CE_CPU: ${{ inputs.cpu }}
          CE_OSDESIGN: ${{ inputs.osdesign }}
          CE_DEFAULTS: ${{ inputs.sysgen_defaults }}
        run: |
          set -euo pipefail
          ENGINE="$PWD/wince-build/build/wcefullbuild"
          test -x "$ENGINE"

          ARGS=(
            --root "$PWD/wince-source/ce600"
            --out "$PWD/full-ce6-out"
            --toolchain cegcc
            --cpu "$CE_CPU"
            --platform "$CE_PLATFORM"
          )

          if [ -n "$CE_OSDESIGN" ]; then
            test -f "$PWD/wince-source/ce600/$CE_OSDESIGN"
            ARGS+=(--osdesign "$PWD/wince-source/ce600/$CE_OSDESIGN")
          elif [ "$CE_DEFAULTS" = true ]; then
            ARGS+=(--sysgen-defaults)
          else
            echo 'No OS Design and sysgen_defaults=false; refusing an under-specified build.' >&2
            exit 2
          fi

          "$ENGINE" "${ARGS[@]}" 2>&1 | tee full-ce6-build.log

          test -s full-ce6-out/build.ninja
          test -s full-ce6-out/ceconfig.h
          test -s full-ce6-out/merged.bib
          test -s full-ce6-out/release/default.hv
          test -s full-ce6-out/release/merged.reg
          test -s full-ce6-out/release/NK.BIN
          sha256sum full-ce6-out/release/NK.BIN | tee nkbin.sha256

      - name: Upload diagnostics and NK.BIN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-ce6-${{ github.run_id }}
          path: |
            revisions.txt
            wcebuild-build.log
            wcebuild-ctest.log
            full-ce6-build.log
            nkbin.sha256
            full-ce6-out/release/NK.BIN
          if-no-files-found: ignore
          retention-days: 14
