name: full-os-build-as-test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'CE6 BSP/platform'
        required: false
        default: DEVICEEMULATOR
        type: string
      cpu:
        description: 'CE6 target CPU'
        required: false
        default: ARMV4I
        type: string
      sysgen_defaults:
        description: 'Use catalog DefaultValue=1 SYSGEN variables'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  full-os-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build platform and CE source
        shell: bash
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "$WINCE_REPO_PAT"
          AUTH=$(printf '%s:%s' 'kagurasumusun' "$WINCE_REPO_PAT" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic ${AUTH}" \
            clone --depth 1 --branch main \
            https://github.com/kagurasumusun/wince-build.git wince-build
          git -c "http.extraheader=Authorization: Basic ${AUTH}" \
            clone --depth 1 --branch main \
            https://github.com/kagurasumusun/wince-source.git wince-source
          git -C wince-build remote set-url origin https://github.com/kagurasumusun/wince-build.git
          git -C wince-source remote set-url origin https://github.com/kagurasumusun/wince-source.git
          git -C wince-build rev-parse HEAD | tee revisions.txt
          git -C wince-source rev-parse HEAD | tee -a revisions.txt
          test -d wince-source/ce600/PUBLIC
          test -d wince-source/ce600/PRIVATE
          test -d wince-source/ce600/PLATFORM

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure and build platform
        working-directory: wince-build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4 --verbose 2>&1 | tee ../wcebuild-build.log
          ctest --test-dir build --output-on-failure --parallel 2 2>&1 | tee ../wcebuild-ctest.log

      - name: Locate unified CE build tool
        shell: bash
        run: |
          set -euo pipefail
          test -x "$PWD/wince-build/build/wcefullbuild"
          echo "WCE_FULLBUILD=$PWD/wince-build/build/wcefullbuild" >> "$GITHUB_ENV"

      - name: Verify repository architecture
        working-directory: wince-build
        shell: bash
        run: |
          set -euo pipefail
          test -d src/model
          test -d src/frontend
          test -d src/build
          test -d src/toolchain
          test -d src/sysgen
          test -d src/image
          test -d src/bsp
          test -d src/sdk
          test -d include/wce/core
          test -d include/wce/model
          test -d include/wce/frontend
          test -d include/wce/build
          test -d include/wce/toolchain
          test -d include/wce/sysgen
          test -d include/wce/image
          test -d include/wce/bsp
          test -d include/wce/sdk
          test -d tools/cli
          test -d tools/inspection
          test -d configs
          test -d third_party/wince-source
          test ! -d src/wce
          test ! -d scripts
          test ! -d config
          test ! -d external
          test ! -d engine

      - name: Run real-tree CE build through the complete pipeline
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          CPU: ${{ inputs.cpu }}
          DEFAULTS: ${{ inputs.sysgen_defaults }}
        run: |
          set -euo pipefail
          ARGS=(
            --root "$PWD/wince-source/ce600"
            --out "$PWD/full-os-out"
            --toolchain cegcc
            --cpu "$CPU"
            --platform "$PLATFORM"
          )
          if [ "$DEFAULTS" = true ]; then
            ARGS+=(--sysgen-defaults)
          fi
          "$WCE_FULLBUILD" "${ARGS[@]}" 2>&1 | tee full-os-build.log

          test -s full-os-out/build.ninja
          test -s full-os-out/ceconfig.h
          test -s full-os-out/merged.bib
          test -s full-os-out/release/default.hv
          test -s full-os-out/release/merged.reg
          test -s full-os-out/release/NK.BIN
          sha256sum full-os-out/release/NK.BIN | tee nkbin.sha256

      - name: Verify pipeline artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s full-os-out/release/NK.BIN
          test -s full-os-out/release/default.hv
          test -s full-os-out/release/merged.reg
          test -s full-os-out/merged.bib
          find full-os-out -type f \( -name '*.o' -o -name '*.a' -o -name '*.lib' -o -name '*.dll' -o -name '*.exe' \) | head -n 20

      - name: Upload diagnostics and image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-os-build-${{ github.run_id }}
          path: |
            revisions.txt
            wcebuild-build.log
            wcebuild-ctest.log
            full-os-build.log
            nkbin.sha256
            full-os-out/release/NK.BIN
            full-os-out/release/default.hv
            full-os-out/release/merged.reg
            full-os-out/merged.bib
          if-no-files-found: ignore
          retention-days: 14
