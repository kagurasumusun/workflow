name: wince-build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wince-build.yml'
  pull_request:
    paths:
      - '.github/workflows/wince-build.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: ubuntu-cegcc
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone private repositories
        shell: bash
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "$WINCE_REPO_PAT"
          rm -rf wince-build wince-source
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0='!f() { echo username=x-access-token; echo "password=$WINCE_REPO_PAT"; }; f'
          git ls-remote --exit-code https://github.com/kagurasumusun/wince-build.git HEAD >/dev/null
          git ls-remote --exit-code https://github.com/kagurasumusun/wince-source.git HEAD >/dev/null
          git clone --depth 1 --branch main https://github.com/kagurasumusun/wince-build.git wince-build
          git clone --depth 1 --branch main https://github.com/kagurasumusun/wince-source.git wince-source
          unset GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_0 GIT_CONFIG_COUNT
          test -f wince-build/CMakeLists.txt
          test -f wince-build/scripts/provision-cegcc.sh
          test -f wince-source/scripts/ce6_extract.py
          echo "wince-build=$(git -C wince-build rev-parse HEAD)"
          echo "wince-source=$(git -C wince-source rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ninja
        run: python -m pip install ninja

      - name: Provision pinned ceGCC 0.59.1 / GCC 4.4.0
        if: matrix.name == 'ubuntu-cegcc'
        shell: bash
        working-directory: wince-build
        run: |
          set -euxo pipefail
          chmod +x scripts/provision-cegcc.sh
          scripts/provision-cegcc.sh "$RUNNER_TEMP/mingw32ce"
          echo "WCE_CEGCC_DIR=$RUNNER_TEMP/mingw32ce/bin" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/mingw32ce/bin/arm-mingw32ce-gcc" --version | head -1

      - name: Setup MSVC
        if: matrix.name == 'windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Record MSVC
        if: matrix.name == 'windows-msvc'
        shell: pwsh
        run: |
          cl 2>&1 | Tee-Object cl-version.log
          where.exe cl | Tee-Object -Append cl-version.log
          where.exe link | Tee-Object -Append cl-version.log

      - name: Configure
        working-directory: wince-build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${WCE_CEGCC_DIR:+-DWCE_CEGCC_DIR=$WCE_CEGCC_DIR}

      - name: Assert CE target E2E registered
        if: matrix.name == 'ubuntu-cegcc'
        working-directory: wince-build/build
        shell: bash
        run: |
          set -euxo pipefail
          grep -rq e2e_cegcc_target . --include=CTestTestfile.cmake
          grep -rq e2e_ceinc_pristine . --include=CTestTestfile.cmake

      - name: Build
        working-directory: wince-build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2 --verbose 2>&1 | tee build.log

      - name: Test
        working-directory: wince-build/build
        shell: bash
        run: |
          set -o pipefail
          ctest --output-on-failure --parallel 2 2>&1 | tee ../ctest.log

      - name: Upload compiler/test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wince-build-${{ matrix.name }}-${{ github.run_id }}
          path: |
            wince-build/build.log
            wince-build/ctest.log
            wince-build/cl-version.log
          if-no-files-found: ignore
          retention-days: 14

# CI trigger refresh after full test-set integration.
