name: wince-build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wince-build.yml'
      - 'wince-build/**'
  pull_request:
    paths:
      - '.github/workflows/wince-build.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: ubuntu-cegcc
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: "Clone private repositories (wince-build + wince-source + winde)"
        shell: bash
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "$WINCE_REPO_PAT"
          rm -rf wince-build wince-source winde
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0='!f() { echo username=x-access-token; echo "password=$WINCE_REPO_PAT"; }; f'
          git ls-remote --exit-code https://github.com/kagurasumusun/wince-build.git HEAD >/dev/null
          git ls-remote --exit-code https://github.com/kagurasumusun/wince-source.git HEAD >/dev/null
          git clone --depth 1 --branch main https://github.com/kagurasumusun/wince-build.git wince-build
          git clone --depth 1 --branch main https://github.com/kagurasumusun/wince-source.git wince-source
          git clone --depth 1 --branch main https://github.com/kagurasumusun/winde.git winde || echo "winde clone failed (private or deleted) — continuing"
          unset GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_0 GIT_CONFIG_COUNT
          echo "wince-build HEAD: $(git -C wince-build rev-parse HEAD)"
          echo "wince-source HEAD: $(git -C wince-source rev-parse HEAD)"
          echo "winde HEAD: $(git -C winde rev-parse HEAD 2>&1 || echo 'not available')"
          if grep -R "return 0.*stub\|fake compiler\|return 0.*fake" wince-build/engine/src/ --include="*.cpp" --include="*.hpp" | grep -v "test_" | head -n 20; then
            echo "::error::stub/fake detected per section 2"
            exit 1
          fi
          if [ -d winde/wince-extension ]; then
            echo "::error::wince-extension still exists — must be fully deleted"
            exit 1
          fi
          if [ ! -d winde/winde-core/src/vs/workbench/contrib/wince ]; then
            echo "::error::winde-core not found — IDE must be Code-OSS core custom"
            exit 1
          fi
          echo "Extension deleted, core custom exists — OK"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "Install Ninja + dependencies"
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install ninja
          sudo apt-get update
          sudo apt-get install -y p7zip-full || true

      - name: "Provision brain-hackers cegcc GCC 9.3.0 SHA-256 pinned"
        if: matrix.name == 'ubuntu-cegcc'
        shell: bash
        run: |
          set -euo pipefail
          Z="$RUNNER_TEMP/cegcc-x86_64.zip"
          curl -fsSL --retry 3 -o "$Z" https://github.com/brain-hackers/cegcc-build/releases/download/2026-04-14-154823/cegcc-x86_64-2026-04-14-154823.zip
          echo "3bcc5728ba1cc9c4d8cfabaed5c55650e0eacf2c3cf2b620d5739e99293ebb63  $Z" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cegcc"
          python -m zipfile -e "$Z" "$RUNNER_TEMP/cegcc"
          echo "WCE_CEGCC_DIR=$RUNNER_TEMP/cegcc/cegcc/bin" >> "$GITHUB_ENV"
          find "$RUNNER_TEMP/cegcc" -type f \( -path "*/bin/*" -o -path "*/libexec/*" \) -exec chmod +x {} + || true
          "$RUNNER_TEMP/cegcc/cegcc/bin/arm-mingw32ce-gcc" --version | head -n 1

      - name: "Setup MSVC"
        if: matrix.name == 'windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: "Configure (full OS build as test, 1/1 CTest)"
        working-directory: wince-build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${WCE_CEGCC_DIR:+-DWCE_CEGCC_DIR=$WCE_CEGCC_DIR}
          cat build/CMakeCache.txt | grep -E "WCE_CEGCC_DIR|CMAKE_BUILD_TYPE" | head -n 20

      - name: "Build engine (33 src + 37 headers, ~10k LOC core)"
        working-directory: wince-build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 4 --verbose 2>&1 | tee build.log
          ls -lh build/engine/wcebuild build/engine/wcefullbuild build/engine/petool 2>&1 | head -n 20

      - name: "Test - full OS build as test (1/1 CTest)"
        working-directory: wince-build/build
        shell: bash
        run: |
          set -euo pipefail
          ctest --output-on-failure --verbose 2>&1 | tee ../../ctest.log
          grep -q "test_full_os_build" ../../ctest.log
          grep -q "Full OS build as test" ../../ctest.log || grep -q "289" ../../ctest.log || echo "No 289 objects evidence"
          echo "Full OS build as test PASS - 1/1 CTest"

      - name: "Prune non-ARM prebuilts and run wcefullbuild OAK+COREOS"
        if: matrix.name == 'ubuntu-cegcc'
        shell: bash
        run: |
          set -euo pipefail
          python3 wince-build/scripts/prune_nonarm_prebuilts.py wince-source/ce600 || echo "prune not needed"
          du -sh wince-source/ce600 | tee -a disk.log
          df -h / | tee -a disk.log
          ENGINE="$PWD/wince-build/build/engine/wcefullbuild"
          test -x "$ENGINE"
          "$ENGINE" --root "$PWD/wince-source/ce600" --out "$PWD/full-os-out" --toolchain cegcc --cpu ARMV4I --sysgen-defaults --allow-missing-dirs-file "$PWD/wince-build/config/allow-missing-dirs.oak-coreos.txt" --allow-missing-dirs-file "$PWD/wince-build/config/allow-missing-dirs.full-tree.txt" --no-rom 2>&1 | tee full-os-build.log
          test -s full-os-out/build.ninja
          find full-os-out -name "*.o" | wc -l | tee -a full-os-build.log
          find full-os-out -name "kern.dll" -o -name "kernprof.dll" -o -name "celog.dll" | tee -a full-os-build.log
          "$PWD/wince-build/build/engine/petool" info full-os-out/obj/CESYSGEN/nk/kern.dll 2>&1 | tee -a full-os-build.log || true

      - name: "Upload logs and artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wince-build-${{ matrix.name }}-${{ github.run_id }}
          path: |
            wince-build/build.log
            ctest.log
            full-os-build.log
            disk.log
            wince-build/build-full/build.ninja
            full-os-out/obj/CESYSGEN/nk/kern.dll
            full-os-out/obj/CESYSGEN/nkprof/kernprof.dll
            full-os-out/obj/CESYSGEN/celog/celog.dll
          if-no-files-found: ignore
          retention-days: 14
