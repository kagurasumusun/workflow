name: wince-build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wince-build.yml'
      - '**'
  pull_request:
    paths:
      - '.github/workflows/wince-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            os: ubuntu-24.04
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout wince-build
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/kagurasumusun/wince-build.git wince-build
          cd wince-build
          git submodule update --init --recursive
          git rev-parse HEAD
          git submodule status

      - name: Configure
        working-directory: wince-build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: wince-build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 4 --verbose 2>&1 | tee build.log

      - name: Test
        working-directory: wince-build
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --verbose 2>&1 | tee ctest.log

      - name: Verify repository architecture
        working-directory: wince-build
        shell: bash
        run: |
          set -euo pipefail
          test -d src/model
          test -d src/frontend
          test -d src/build
          test -d src/toolchain
          test -d src/sysgen
          test -d src/image
          test -d src/bsp
          test -d src/sdk
          test -d include
          test -d compat
          test -d tools/cli
          test -d tools/inspection
          test -d tools/source
          test -d tools/toolchain
          test -d tools/verification
          test -d configs
          test -d tests
          test -d docs
          test -d third_party/wince-source
          test ! -d src/wce
          test ! -d config
          test ! -d scripts
          test ! -d external
          test ! -d engine
          test ! -d .github/workflows
          test ! -f tools/wcebuild/main.cpp
          test ! -f tools/wcefullbuild/main.cpp
          test ! -f tools/wcesysgen/main.cpp
          test ! -f tools/wceromimage/main.cpp
          test ! -f tools/petool/main.cpp
          if grep -R -E '(^|[[:space:]"(])((src/wce|scripts|config|external/wince-source|engine)/)' \
              src include compat tools configs CMakeLists.txt .gitmodules README.md --exclude='*.log'; then
            echo '::error::stale active repository-layout path detected'
            exit 1
          fi

      - name: Verify public architecture contract
        working-directory: wince-build
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/REPOSITORY-ARCHITECTURE.md
          test -s docs/HANDOFF.md
          test -s docs/PROJECT-HISTORY.md
          grep -q 'Ninja' docs/HANDOFF.md
          grep -q 'SYSGEN' docs/HANDOFF.md
          grep -q 'ROMIMAGE' docs/HANDOFF.md
          grep -q 'NK.BIN' docs/HANDOFF.md
          grep -q 'winde' docs/HANDOFF.md

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wince-build-${{ matrix.name }}-${{ github.run_id }}
          path: |
            wince-build/build.log
            wince-build/ctest.log
          if-no-files-found: ignore
          retention-days: 14
