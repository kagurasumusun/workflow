name: wince-build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wince-build.yml'
      - '**'
  pull_request:
    paths:
      - '.github/workflows/wince-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            os: ubuntu-24.04
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout wince-build
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/kagurasumusun/wince-build.git wince-build
          cd wince-build
          git submodule update --init --recursive
          git rev-parse HEAD
          git submodule status

      - name: Configure
        working-directory: wince-build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: wince-build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 4 --verbose 2>&1 | tee build.log

      - name: Test
        working-directory: wince-build
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --verbose 2>&1 | tee ctest.log

      - name: Verify professional repository boundaries
        working-directory: wince-build
        shell: bash
        run: |
          set -euo pipefail
          test -d src
          test -d include
          test -d compat
          test -d tools
          test -d tests
          test -d config
          test -d docs
          test -d external/wince-source
          test ! -d engine
          test ! -d .github/workflows
          if grep -R 'engine/' --exclude-dir=.git --exclude='*.log' .; then
            echo '::error::stale engine/ path detected'
            exit 1
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wince-build-${{ matrix.name }}-${{ github.run_id }}
          path: |
            wince-build/build.log
            wince-build/ctest.log
          if-no-files-found: ignore
          retention-days: 14
