name: wince-source-extract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kagurasumusun/wince-source
          ref: main
          token: ${{ secrets.WINCE_REPO_PAT }}
          fetch-depth: 1
      - name: Install extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python3 -m pip install -r scripts/requirements.txt
      - name: Extract CE6
        run: |
          rm -rf ce600
          python3 scripts/ce6_extract.py build -o ce600 --stream-cabs
      - name: Verify
        run: |
          test -d ce600/PUBLIC
          test -d ce600/PRIVATE
          test -d ce600/PLATFORM
          du -sh ce600
