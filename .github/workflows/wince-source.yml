name: wince-source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 p7zip-full python3-olefile
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Clone wince-source
        shell: bash
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "$WINCE_REPO_PAT"
          rm -rf wince-source
          AUTH=$(printf '%s:%s' 'kagurasumusun' "$WINCE_REPO_PAT" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic ${AUTH}" \
            clone --depth 1 --branch main \
            https://github.com/kagurasumusun/wince-source.git wince-source

      - name: Download, extract and push CE6 media incrementally
        working-directory: wince-source
        shell: bash
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
          IA_BASE: https://archive.org/download/windows-ce-6/en_windows_embedded_ce_6.0_dvd.iso
          IA_R2: https://archive.org/download/windows-ce-6/CE6R2.iso
          IA_R3: https://archive.org/download/windows-ce-6/CE6R3.iso
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/ce6" ce600

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.version HTTP/1.1
          git config gc.auto 0
          git config maintenance.auto false
          git config pack.windowMemory 64m
          git config pack.packSizeLimit 100m
          git config pack.threads 2

          AUTH=$(printf '%s:%s' 'kagurasumusun' "$WINCE_REPO_PAT" | base64 -w0)

          # Keep every push comfortably below GitHub's 2 GiB push limit.
          # This is only a transport/commit boundary; no source files are removed.
          BATCH_LIMIT=$((700 * 1024 * 1024))
          BATCH_FILE="$RUNNER_TEMP/ce6/batch-paths"

          push_batches() {
            local tag="$1"
            local batch=0
            local bytes=0
            local size
            local path

            : > "$BATCH_FILE"

            while IFS= read -r -d '' path; do
              size=$(stat -c '%s' -- "$path")

              if [ "$bytes" -gt 0 ] && [ $((bytes + size)) -gt "$BATCH_LIMIT" ]; then
                batch=$((batch + 1))
                git add --pathspec-from-file="$BATCH_FILE" --pathspec-file-nul

                if ! git diff --cached --quiet; then
                  git commit -m "Import Windows CE 6.0 ${tag} source batch ${batch}"

                  for attempt in 1 2 3; do
                    if git -c "http.extraheader=Authorization: Basic ${AUTH}" \
                      push origin HEAD:main; then
                      break
                    fi
                    if [ "$attempt" -eq 3 ]; then
                      return 1
                    fi
                    sleep $((attempt * 15))
                  done
                fi

                : > "$BATCH_FILE"
                bytes=0
              fi

              printf '%s\0' "$path" >> "$BATCH_FILE"
              bytes=$((bytes + size))
            done < <(git ls-files -z --others --exclude-standard ce600/)

            if [ -s "$BATCH_FILE" ]; then
              batch=$((batch + 1))
              git add --pathspec-from-file="$BATCH_FILE" --pathspec-file-nul

              if ! git diff --cached --quiet; then
                git commit -m "Import Windows CE 6.0 ${tag} source batch ${batch}"

                for attempt in 1 2 3; do
                  if git -c "http.extraheader=Authorization: Basic ${AUTH}" \
                    push origin HEAD:main; then
                    break
                  fi
                  if [ "$attempt" -eq 3 ]; then
                    return 1
                  fi
                  sleep $((attempt * 15))
                done
              fi
            fi
          }

          download_extract_push() {
            local tag="$1"
            local url="$2"
            local iso="$RUNNER_TEMP/ce6/${tag}.iso"

            aria2c \
              --continue=true \
              --max-connection-per-server=16 \
              --split=16 \
              --min-split-size=16M \
              --file-allocation=none \
              --auto-file-renaming=false \
              --summary-interval=10 \
              --console-log-level=notice \
              --out="${tag}.iso" \
              --dir="$RUNNER_TEMP/ce6" \
              "$url"

            python3 scripts/ce6_lowdisk_driver.py \
              --iso "${tag}=${iso}" \
              --scope source \
              -o "$GITHUB_WORKSPACE/wince-source/ce600"

            rm -f "$iso"
            push_batches "$tag"
          }

          download_extract_push base "$IA_BASE"
          download_extract_push r2 "$IA_R2"
          download_extract_push r3 "$IA_R3"
