name: wince-source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 p7zip-full python3-pip
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Clone wince-source
        shell: bash
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "$WINCE_REPO_PAT"
          rm -rf wince-source
          AUTH=$(printf '%s:%s' 'kagurasumusun' "$WINCE_REPO_PAT" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic ${AUTH}" \
            clone --depth 1 --branch main \
            https://github.com/kagurasumusun/wince-source.git wince-source
          cd wince-source
          python3 -m pip install --break-system-packages -r scripts/requirements.txt

      - name: Download, extract and push CE6 media incrementally
        working-directory: wince-source
        shell: bash
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
          IA_BASE: https://archive.org/download/windows-ce-6/en_windows_embedded_ce_6.0_dvd.iso
          IA_R2: https://archive.org/download/windows-ce-6/CE6R2.iso
          IA_R3: https://archive.org/download/windows-ce-6/CE6R3.iso
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/ce6" ce600

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.version HTTP/1.1
          git config http.postBuffer 524288000
          git config http.maxRequestBuffer 100M
          git config pack.windowMemory 100m
          git config pack.packSizeLimit 100m
          git config pack.threads 2

          AUTH=$(printf '%s:%s' 'kagurasumusun' "$WINCE_REPO_PAT" | base64 -w0)

          download_extract_push() {
            local tag="$1"
            local url="$2"
            local iso="$RUNNER_TEMP/ce6/${tag}.iso"

            aria2c \
              --continue=true \
              --max-connection-per-server=16 \
              --split=16 \
              --min-split-size=16M \
              --file-allocation=none \
              --auto-file-renaming=false \
              --summary-interval=10 \
              --console-log-level=notice \
              --out="${tag}.iso" \
              --dir="$RUNNER_TEMP/ce6" \
              "$url"

            python3 scripts/ce6_lowdisk_driver.py \
              --iso "${tag}=${iso}" \
              --scope source \
              -o "$GITHUB_WORKSPACE/wince-source/ce600"

            rm -f "$iso"

            git add ce600/
            git diff --cached --quiet && return 0
            git commit -m "Import Windows CE 6.0 ${tag} source"

            for attempt in 1 2 3; do
              if git -c "http.extraheader=Authorization: Basic ${AUTH}" \
                push origin HEAD:main; then
                return 0
              fi
              [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
            done
            return 1
          }

          download_extract_push base "$IA_BASE"
          download_extract_push r2 "$IA_R2"
          download_extract_push r3 "$IA_R3"
