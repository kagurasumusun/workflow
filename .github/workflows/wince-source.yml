name: wince-source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone private wince-source
        shell: bash
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "$WINCE_REPO_PAT"
          rm -rf wince-source
          git -c http.extraheader="AUTHORIZATION: bearer ${WINCE_REPO_PAT}" clone --depth 1 --branch main https://github.com/kagurasumusun/wince-source.git wince-source
          cd wince-source
          git rev-parse HEAD
          test -f scripts/ce6_extract.py
          test -f scripts/ce6_lowdisk_driver.py
          test -f scripts/requirements.txt

      - name: Install extraction dependencies
        working-directory: wince-source
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full python3-pip
          python3 -m pip install --break-system-packages -r scripts/requirements.txt

      - name: Download and extract CE6 in one continuous runner job
        working-directory: wince-source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ce600 .ce6_media
          python3 scripts/ce6_lowdisk_driver.py -o ce600

      - name: Verify complete source tree
        working-directory: wince-source
        run: |
          set -euo pipefail
          test -d ce600/PUBLIC
          test -d ce600/PRIVATE
          test -d ce600/PLATFORM
          test -f ce600/manifest.json
          du -sh ce600
          python3 - <<'PY'
          import json
          with open('ce600/manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          assert m.get('count', 0) > 100000, m.get('count')
          assert len(m.get('isos', [])) == 3, m.get('isos')
          print('verified files:', m['count'])
          PY
