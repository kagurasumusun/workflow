name: repair-wince-build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-wince-build.yml'

permissions:
  contents: read

jobs:
  repair-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Clone private wince-build
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WINCE_REPO_PAT"
          git -c http.extraheader="AUTHORIZATION: bearer ${WINCE_REPO_PAT}" clone --depth 1 --branch main https://github.com/kagurasumusun/wince-build.git wince-build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply clean-room build repairs
        working-directory: wince-build
        shell: python
        run: |
          from pathlib import Path
          p = Path('engine/src/ninjaemit.cpp')
          s = p.read_text(encoding='utf-8')
          old = 'else if(t.type==TargetType::DynLink){std::string dll=mainout,implib;if(tc.pe_import_lib){auto pit=produced.find(to_lower(t.name+".lib"));if(pit==produced.end())problems.push_back(t.dir_rel+": DLL target has no import-library output entry: "+t.name+".lib");else implib=pit->second;if(!implib.empty())o<<"build "<<nescape(q(implib))<<" | ";}o<<"build "<<nescape(q(dll))<<": dll";'
          new = 'else if(t.type==TargetType::DynLink){std::string dll=mainout,implib;if(tc.pe_import_lib){auto pit=produced.find(to_lower(t.name+".lib"));if(pit==produced.end())problems.push_back(t.dir_rel+": DLL target has no import-library output entry: "+t.name+".lib");else implib=pit->second;}o<<"build "<<nescape(q(dll));if(!implib.empty())o<<" "<<nescape(q(implib));o<<": dll";'
          if old in s: p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('engine/include/wce/fullbuild.hpp')
          s = p.read_text(encoding='utf-8')
          if 'allow_missing_dirs_files' not in s:
              s = s.replace('    std::vector<std::string> excluded_variables;\n', '    std::vector<std::string> excluded_variables;\n    std::vector<std::string> allow_missing_dirs_files;\n', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('engine/fullbuild/main.cpp')
          s = p.read_text(encoding='utf-8')
          if '--allow-missing-dirs-file' not in s:
              s = s.replace('            else if (a == "--exclude") o.excluded_variables.push_back(need("--exclude"));\n', '            else if (a == "--exclude") o.excluded_variables.push_back(need("--exclude"));\n            else if (a == "--allow-missing-dirs-file") o.allow_missing_dirs_files.push_back(need("--allow-missing-dirs-file"));\n', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('engine/src/fullbuild.cpp')
          s = p.read_text(encoding='utf-8')
          if '#include "wce/sysgen_output.hpp"' not in s:
              s = s.replace('#include "wce/sysgen.hpp"\n', '#include "wce/sysgen.hpp"\n#include "wce/sysgen_output.hpp"\n', 1)
          if 'load_missing_dirs_files' not in s:
              helper = '''\nstatic std::set<std::string> load_missing_dirs_files(const std::vector<std::string>& files) {\n    std::set<std::string> out;\n    for (const auto& file : files) {\n        std::ifstream f(file);\n        if (!f) throw ParseError("fullbuild: cannot open allow-missing-dirs file: " + file);\n        std::string line;\n        while (std::getline(f, line)) { auto p=line.find('#'); if(p!=std::string::npos) line.resize(p); line=trim(line); if(line.empty()) continue; out.insert(to_lower(to_fwd(fs::path(line).lexically_normal().string()))); }\n    }\n    return out;\n}\n'''
              s = s.replace('static void apply_global_build_layers(', helper + '\nstatic void apply_global_build_layers(', 1)
          if 'default_start_dirs' not in s:
              helper = '''\nstatic std::vector<std::string> default_start_dirs(const fs::path& root) {\n    std::vector<std::string> out; const char* roots[] = {"PUBLIC","PRIVATE","PLATFORM","OTHERS","SDK"}; std::error_code ec;\n    for(const char* r:roots){ fs::path base=root/r; if(!fs::is_directory(base,ec)) continue; for(fs::recursive_directory_iterator it(base,fs::directory_options::skip_permission_denied,ec),end;it!=end;it.increment(ec)){ if(ec){ec.clear();continue;} if(!it->is_regular_file(ec) || to_lower(it->path().filename().string())!="dirs") continue; auto rel=fs::relative(it->path().parent_path(),root,ec); if(!ec) out.push_back(to_fwd(rel.string())); } }\n    std::sort(out.begin(),out.end()); out.erase(std::unique(out.begin(),out.end()),out.end()); return out;\n}\n'''
              s = s.replace('static std::set<std::string> load_missing_dirs_files(', helper + '\nstatic std::set<std::string> load_missing_dirs_files(', 1)
          s = s.replace('so.root_abs=root.string();so.strict=o.strict;so.start_dirs=o.start_dirs.empty()?std::vector<std::string>{"."}:o.start_dirs;so.allow_missing_dirs=load_missing_dirs_files(o.allow_missing_dirs_files);', 'so.root_abs=root.string();so.strict=o.strict;so.start_dirs=o.start_dirs.empty()?default_start_dirs(root):o.start_dirs;so.allow_missing_dirs=load_missing_dirs_files(o.allow_missing_dirs_files);', 1)
          if '#include "wce/buildvalidate.hpp"' not in s:
              s = s.replace('#include "wce/graph.hpp"\n', '#include "wce/graph.hpp"\n#include "wce/buildvalidate.hpp"\n', 1)
          if 'validate_build_graph(graph,false,rep);' not in s:
              s = s.replace('auto graph=scan_tree(so,seed);', 'auto graph=scan_tree(so,seed);validate_build_graph(graph,false,rep);', 1)
          p.write_text(s, encoding='utf-8')

      - name: Build engine and run unit tests
        working-directory: wince-build
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/check_cleanroom_provenance.py .
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Exercise clean-room PE32 relocation engine
        working-directory: wince-build
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/pe_reloc_smoke.cpp <<'CPP'
          #include <cstdint>
          #include <vector>
          #include <cstdio>
          #include "engine/include/wce/romimage.hpp"
          int main() {
            std::vector<uint8_t> image(0x100, 0);
            image[0x20]=0x00; image[0x21]=0x10; image[0x22]=0x00; image[0x23]=0x80;
            image[0x40]=0x00; image[0x41]=0x00; image[0x42]=0x00; image[0x43]=0x00;
            image[0x44]=0x0c; image[0x45]=0x00;
            image[0x48]=0x00; image[0x49]=0x30;
            wce::Report rep; wce::PeRelocationStats st{};
            if (!wce::apply_pe32_relocations(image, 0x80000000u, 0x80001000u, 0x40, 12, &st, &rep)) return 1;
            if (image[0x20]!=0x00 || image[0x21]!=0x20 || image[0x22]!=0x00 || image[0x23]!=0x80) return 2;
            if (st.highlow != 1) return 3;
            std::puts("PE32 relocation smoke OK");
            return 0;
          }
          CPP
          c++ -std=c++17 -I. /tmp/pe_reloc_smoke.cpp -o /tmp/pe_reloc_smoke
          /tmp/pe_reloc_smoke

      - name: Commit repairs to private main
        working-directory: wince-build
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wince-ci'
          git config user.email 'wince-ci@users.noreply.github.com'
          git add engine/src/ninjaemit.cpp engine/src/fullbuild.cpp engine/include/wce/fullbuild.hpp engine/fullbuild/main.cpp
          if git diff --cached --quiet; then echo 'No repairs to commit.'; exit 0; fi
          git commit -m 'fix: harden fullbuild graph and source-root discovery'
          git -c http.extraheader="AUTHORIZATION: bearer ${WINCE_REPO_PAT}" push origin HEAD:main
