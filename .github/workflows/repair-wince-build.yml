name: repair-wince-build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-wince-build.yml'

permissions:
  contents: read

jobs:
  repair-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Clone private wince-build
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WINCE_REPO_PAT"
          git -c http.extraheader="AUTHORIZATION: bearer ${WINCE_REPO_PAT}" clone --depth 1 --branch main https://github.com/kagurasumusun/wince-build.git wince-build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply clean-room build repairs
        working-directory: wince-build
        shell: python
        run: |
          from pathlib import Path
          p = Path('engine/src/ninjaemit.cpp')
          s = p.read_text(encoding='utf-8')
          old = 'else if(t.type==TargetType::DynLink){std::string dll=mainout,implib;if(tc.pe_import_lib){auto pit=produced.find(to_lower(t.name+".lib"));if(pit==produced.end())problems.push_back(t.dir_rel+": DLL target has no import-library output entry: "+t.name+".lib");else implib=pit->second;if(!implib.empty())o<<"build "<<nescape(q(implib))<<" | ";}o<<"build "<<nescape(q(dll))<<": dll";'
          new = 'else if(t.type==TargetType::DynLink){std::string dll=mainout,implib;if(tc.pe_import_lib){auto pit=produced.find(to_lower(t.name+".lib"));if(pit==produced.end())problems.push_back(t.dir_rel+": DLL target has no import-library output entry: "+t.name+".lib");else implib=pit->second;}o<<"build "<<nescape(q(dll));if(!implib.empty())o<<" "<<nescape(q(implib));o<<": dll";'
          if old not in s:
              raise SystemExit('expected malformed DLL emission pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('engine/src/fullbuild.cpp')
          s = p.read_text(encoding='utf-8')
          if '#include "wce/sysgen_output.hpp"' not in s:
              s = s.replace('#include "wce/sysgen.hpp"\n', '#include "wce/sysgen.hpp"\n#include "wce/sysgen_output.hpp"\n', 1)
          old = 'write_env((out/"sysgen.env").string(),sg.sysgen_env);'
          new = 'fs::create_directories(out/"sysgen");write_env((out/"sysgen.env").string(),sg.sysgen_env);write_ceconfig_h(sg,(out/"ceconfig.h").string());write_bib_file(sg.merged_bib,(out/"sysgen"/"merged.bib").string());'
          if old not in s:
              raise SystemExit('expected SYSGEN output insertion point not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Build engine and run unit tests
        working-directory: wince-build
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/check_cleanroom_provenance.py .
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Commit repairs to private main
        working-directory: wince-build
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wince-ci'
          git config user.email 'wince-ci@users.noreply.github.com'
          git add engine/src/ninjaemit.cpp engine/src/fullbuild.cpp
          if git diff --cached --quiet; then
            echo 'No repairs to commit.'
            exit 0
          fi
          git commit -m 'fix: repair full-build output and Ninja DLL emission'
          git -c http.extraheader="AUTHORIZATION: bearer ${WINCE_REPO_PAT}" push origin HEAD:main
