name: repair-wince-build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-wince-build.yml'

permissions:
  contents: read

jobs:
  repair-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Clone private wince-build
        env:
          WINCE_REPO_PAT: ${{ secrets.WINCE_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WINCE_REPO_PAT"
          rm -rf wince-build
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0='!f() { echo username=x-access-token; echo "password=$WINCE_REPO_PAT"; }; f'
          git ls-remote --exit-code https://github.com/kagurasumusun/wince-build.git HEAD >/dev/null
          git clone --depth 1 --branch main https://github.com/kagurasumusun/wince-build.git wince-build
          unset GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_0 GIT_CONFIG_COUNT

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build engine and run unit tests
        working-directory: wince-build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          ctest --test-dir build --output-on-failure -R '^test_pefixup$'

# CI trigger refresh after full test-set integration.
# Temporary dummy create/delete cycle completed; rebuild latest wince-build.
